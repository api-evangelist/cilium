        idempotent: true
      call: cilium-policy.getidentity
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-get-policy-selectors
      description: Cilium Get policy selectors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-policy.getpolicyselectors
      outputParameters:
      - type: object
        mapping: $.
