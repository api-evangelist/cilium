naftiko: 1.0.0-alpha2
info:
  label: Cilium API
  description: 'Cilium API. 5 operations. Lead operation: Cilium List local redirect policies. Self-contained Naftiko capability
    covering one Cilium business surface.'
  tags:
  - Cilium
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CILIUM_API_KEY: CILIUM_API_KEY
capability:
  consumes:
  - type: http
    namespace: cilium-general
    baseUri: http://localhost/v1
    description: Cilium API business capability. Self-contained, no shared references.
    resources:
    - name: lrp
      path: /lrp
      operations:
      - name: listlocalredirectpolicies
        method: GET
        description: Cilium List local redirect policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: service
      path: /service
      operations:
      - name: listservices
        method: GET
        description: Cilium List services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: service-id
      path: /service/{id}
      operations:
      - name: getservice
        method: GET
        description: Cilium Get service by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putservice
        method: PUT
        description: Cilium Create or update service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteservice
        method: DELETE
        description: Cilium Delete service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: cilium-general-rest
    port: 8080
    description: REST adapter for Cilium API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/lrp
      name: lrp
      description: REST surface for lrp.
      operations:
      - method: GET
        name: listlocalredirectpolicies
        description: Cilium List local redirect policies
        call: cilium-general.listlocalredirectpolicies
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/service
      name: service
      description: REST surface for service.
      operations:
      - method: GET
        name: listservices
        description: Cilium List services
        call: cilium-general.listservices
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/service/{id}
      name: service-id
      description: REST surface for service-id.
      operations:
      - method: GET
        name: getservice
        description: Cilium Get service by ID
        call: cilium-general.getservice
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putservice
        description: Cilium Create or update service
        call: cilium-general.putservice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteservice
        description: Cilium Delete service
        call: cilium-general.deleteservice
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cilium-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cilium API. One tool per consumed operation, routed inline through this capability's consumes
      block.
    tools:
    - name: cilium-list-local-redirect-policies
      description: Cilium List local redirect policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-general.listlocalredirectpolicies
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-list-services
      description: Cilium List services
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-general.listservices
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-get-service-id
      description: Cilium Get service by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-general.getservice
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-create-update-service
      description: Cilium Create or update service
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cilium-general.putservice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-delete-service
      description: Cilium Delete service
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cilium-general.deleteservice
      outputParameters:
      - type: object
        mapping: $.
