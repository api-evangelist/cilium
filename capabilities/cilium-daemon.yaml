naftiko: 1.0.0-alpha2
info:
  label: Cilium API — Daemon
  description: 'Cilium API — Daemon. 7 operations. Lead operation: Cilium List cluster nodes. Self-contained Naftiko capability
    covering one Cilium business surface.'
  tags:
  - Cilium
  - Daemon
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CILIUM_API_KEY: CILIUM_API_KEY
capability:
  consumes:
  - type: http
    namespace: cilium-daemon
    baseUri: http://localhost/v1
    description: Cilium API — Daemon business capability. Self-contained, no shared references.
    resources:
    - name: cluster-nodes
      path: /cluster/nodes
      operations:
      - name: getclusternodes
        method: GET
        description: Cilium List cluster nodes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: config
      path: /config
      operations:
      - name: getdaemonconfig
        method: GET
        description: Cilium Get daemon configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchdaemonconfig
        method: PATCH
        description: Cilium Modify daemon configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: debuginfo
      path: /debuginfo
      operations:
      - name: getdebuginfo
        method: GET
        description: Cilium Get debugging information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: healthz
      path: /healthz
      operations:
      - name: getdaemonhealth
        method: GET
        description: Cilium Get daemon health status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: map
      path: /map
      operations:
      - name: getbpfmaps
        method: GET
        description: Cilium List BPF maps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: node-ids
      path: /node/ids
      operations:
      - name: getnodeids
        method: GET
        description: Cilium Get node IDs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: cilium-daemon-rest
    port: 8080
    description: REST adapter for Cilium API — Daemon. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/cluster/nodes
      name: cluster-nodes
      description: REST surface for cluster-nodes.
      operations:
      - method: GET
        name: getclusternodes
        description: Cilium List cluster nodes
        call: cilium-daemon.getclusternodes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/config
      name: config
      description: REST surface for config.
      operations:
      - method: GET
        name: getdaemonconfig
        description: Cilium Get daemon configuration
        call: cilium-daemon.getdaemonconfig
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patchdaemonconfig
        description: Cilium Modify daemon configuration
        call: cilium-daemon.patchdaemonconfig
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/debuginfo
      name: debuginfo
      description: REST surface for debuginfo.
      operations:
      - method: GET
        name: getdebuginfo
        description: Cilium Get debugging information
        call: cilium-daemon.getdebuginfo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/healthz
      name: healthz
      description: REST surface for healthz.
      operations:
      - method: GET
        name: getdaemonhealth
        description: Cilium Get daemon health status
        call: cilium-daemon.getdaemonhealth
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/map
      name: map
      description: REST surface for map.
      operations:
      - method: GET
        name: getbpfmaps
        description: Cilium List BPF maps
        call: cilium-daemon.getbpfmaps
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/node/ids
      name: node-ids
      description: REST surface for node-ids.
      operations:
      - method: GET
        name: getnodeids
        description: Cilium Get node IDs
        call: cilium-daemon.getnodeids
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cilium-daemon-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cilium API — Daemon. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: cilium-list-cluster-nodes
      description: Cilium List cluster nodes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-daemon.getclusternodes
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-get-daemon-configuration
      description: Cilium Get daemon configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-daemon.getdaemonconfig
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-modify-daemon-configuration
      description: Cilium Modify daemon configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cilium-daemon.patchdaemonconfig
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-get-debugging-information
      description: Cilium Get debugging information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-daemon.getdebuginfo
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-get-daemon-health-status
      description: Cilium Get daemon health status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-daemon.getdaemonhealth
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-list-bpf-maps
      description: Cilium List BPF maps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-daemon.getbpfmaps
      outputParameters:
      - type: object
        mapping: $.
    - name: cilium-get-node-ids
      description: Cilium Get node IDs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cilium-daemon.getnodeids
      outputParameters:
      - type: object
        mapping: $.
