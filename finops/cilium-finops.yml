meters:
  - name: agent_overhead
    description: vCPU and RAM consumed by cilium-agent DaemonSets across cluster nodes
    unit: vCPU-hour
    aggregation: sum
    dimensions:
      - cluster
      - node_pool
  - name: hubble_overhead
    description: Resources consumed by Hubble and Hubble Relay (observability stack)
    unit: vCPU-hour
    aggregation: sum
    dimensions:
      - cluster
  - name: tetragon_overhead
    description: Resources consumed by Tetragon DaemonSets (runtime security)
    unit: vCPU-hour
    aggregation: sum
    dimensions:
      - cluster
  - name: enterprise_subscription
    description: Optional Isovalent Enterprise / Cisco subscription line (when purchased)
    unit: month
    aggregation: sum
    dimensions:
      - tier
principles:
  - name: Visibility
    description: Track Cilium's cluster overhead through Kubernetes resource usage (cAdvisor,
      kube-state-metrics, Prometheus) and tag DaemonSet cost back to platform engineering.
  - name: Allocation
    description: Allocate Cilium overhead to the platform / networking cost center; allocate
      Hubble / Tetragon overhead to the security observability team if separately funded.
  - name: Optimization
    description: Tune Hubble flow retention, Tetragon policy footprint, and cilium-agent memory
      limits to reduce per-node overhead; only enable Cluster Mesh and advanced features where they
      pay back in security or operational simplification.
  - name: Accountability
    description: Platform engineering owns Cilium runtime cost and version cadence; security owns
      Tetragon policy; finance reviews any Isovalent Enterprise subscription against the value
      delivered (support, hardening, certified releases).
maintainers:
