description: 'FOCUS-aligned FinOps for Cilium: the upstream project itself is free (Apache 2.0). The
  cost surface is internal — compute / memory consumed by cilium-agent, Hubble, Hubble Relay, and
  Tetragon DaemonSets in customer clusters, plus the optional Isovalent Enterprise subscription
  (Cisco) for organizations that want a supported distribution. There is no metered billing surface
  exposed by Cilium itself.'
notes: Cilium is free and open source. Cost surfaces below describe internal infrastructure cost
  (cluster overhead) and optional commercial subscription cost.
sources:
  - https://cilium.io/
  - https://docs.cilium.io/
  - https://isovalent.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Cilium Authors / CNCF
serviceCategory: Cloud Native Networking & Security
billingModel:
  pricingCategory: Open Source (Optional Commercial Subscription)
  billingFrequency: N/A (upstream) / Annual (Isovalent Enterprise)
  billingCurrency: USD
  chargeCategories:
    - Adjustment
    - Purchase
focusColumns:
  ServiceName: Cilium
  ServiceCategory: Cloud Native Networking & Security
  ProviderName: Cilium / CNCF
