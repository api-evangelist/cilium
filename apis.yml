description: >-
  Cilium is an open source, cloud native solution for providing, securing, and observing network connectivity between
  workloads, fueled by the revolutionary kernel technology eBPF. Cilium provides network security, load balancing, and
  observability for Kubernetes clusters.
apis:
- aid: cilium:hubble-api
  name: Hubble API
  tags:
  - eBPF
  - Kubernetes
  - Networking
  - Observability
  humanURL: https://docs.cilium.io/en/stable/observability/hubble/index.html
  properties:
  - url: https://docs.cilium.io/en/stable/observability/hubble/index.html
    type: Documentation
  - url: https://docs.cilium.io/en/stable/internals/hubble/
    type: Reference
  - url: asyncapi/cilium-hubble-asyncapi.yml
    type: AsyncAPI
  - url: https://github.com/cilium/hubble
    type: GitHubRepository
  - url: https://github.com/cilium/hubble/releases
    type: ChangeLog
  description: >-
    The Hubble API is a gRPC-based observability API built on top of Cilium and eBPF that provides deep
    visibility into network flows, DNS queries, HTTP requests, and service communication within Kubernetes
    clusters. It exposes Observer and Peer gRPC services for querying flows, nodes, namespaces, and server
    status across single nodes or entire clusters via Hubble Relay.
- aid: cilium:tetragon-api
  name: Tetragon API
  tags:
  - eBPF
  - Kubernetes
  - Observability
  - Security
  humanURL: https://tetragon.io/docs/reference/grpc-api/
  properties:
  - url: https://tetragon.io/docs/reference/grpc-api/
    type: Documentation
  - url: https://tetragon.io/docs/
    type: Reference
  - url: https://github.com/cilium/tetragon
    type: GitHubRepository
  - url: https://tetragon.io/docs/getting-started/
    type: GettingStarted
  - url: https://github.com/cilium/tetragon/releases
    type: ChangeLog
  description: >-
    The Tetragon gRPC API provides access to eBPF-based security observability and runtime enforcement
    capabilities. It enables querying of kernel-level events including process execution, file access,
    and network activity, and supports defining tracing policies via Kubernetes custom resources for real-time
    enforcement and event streaming.
- aid: cilium:hubble-relay-api
  name: Hubble Relay API
  tags:
  - gRPC
  - Kubernetes
  - Networking
  - Observability
  humanURL: https://docs.cilium.io/en/stable/observability/hubble/index.html
  properties:
  - url: https://docs.cilium.io/en/stable/observability/hubble/index.html
    type: Documentation
  - url: https://github.com/cilium/cilium/tree/main/api/v1/relay
    type: Reference
  - url: https://github.com/cilium/cilium
    type: GitHubRepository
  - url: https://github.com/cilium/cilium/releases
    type: ChangeLog
  description: >-
    The Hubble Relay API is a gRPC service that aggregates and relays network flow data from multiple
    Hubble agents running across Kubernetes cluster nodes. It provides a single cluster-wide endpoint
    for the Hubble Observer service, enabling centralized queries of flow data, DNS events, and HTTP metrics
    from all nodes through Hubble Relay without connecting to each node individually.
